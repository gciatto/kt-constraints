name: Docs
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble documentation site
        run: ./gradlew :documentation:assembleSite
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build/assembledSite
      - name: Docs summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: Documentation build
          status: ${{ job.status }}

  deploy:
    if: github.ref == 'refs/heads/master' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
