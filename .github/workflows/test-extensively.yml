name: Test Extensively
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM Kotest suites
        run: ./gradlew jvmTest --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: JVM tests / ${{ matrix.os }} / JDK ${{ matrix.jdk }}
          status: ${{ job.status }}

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin/JS Kotest suites
        run: ./gradlew jsTest --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: JavaScript tests / Node 22
          status: ${{ job.status }}

  test-native:
    # Native targets appear incrementally; this job only tests a target when registered.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
          - os: macos-latest
            target: macosArm64
          - os: windows-latest
            target: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision the pinned HiGHS C library
        if: matrix.target != 'mingwX64'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: ./.github/scripts/provision-highs.sh
      - name: Test portable representation and solver contracts on native target
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: ./.github/scripts/test-native.sh
      - name: Test the C shared library from C, against the pinned Z3
        if: matrix.target != 'mingwX64'
        run: ./gradlew :interop-c:nativeUsageTest
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: Native tests / ${{ matrix.target }}
          status: ${{ job.status }}

  test-minizinc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned MiniZinc multi-engine bundle
        shell: bash
        run: ./.github/scripts/provision-minizinc.sh
      - name: Run five actual engine conformance and differential suites
        env:
          MINIZINC_EXECUTABLE: minizinc
          MINIZINC_ENGINES: gecode,chuffed,cp-sat,highs,cbc
        run: >-
          ./gradlew :solve-minizinc:jvmTest :solve-minizinc:jsNodeTest :solve-minizinc:linuxX64Test
          :interop-js:typescriptUsageTest --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: MiniZinc / five-engine conformance
          status: ${{ job.status }}

  test-minizinc-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run actual Chuffed browser Wasm contracts
        env:
          MINIZINC_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :solve-minizinc:jsBrowserTest --continue
      - name: Run actual Z3 browser Wasm contracts (cross-origin isolated)
        env:
          Z3_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :solve-z3:jsBrowserTest --continue
      - name: Run the TypeScript facade checks in Chromium against the packaged library (Z3 and Chuffed Wasm)
        env:
          INTEROP_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :interop-js:typescriptBrowserUsageTest --continue
      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minizinc-browser-test-results
          path: |
            solve-minizinc/build/test-results/jsBrowserTest
            solve-minizinc/build/reports/tests/jsBrowserTest
            build/js/packages/kt-constraints-solve-minizinc-test/browser-console.log
            solve-z3/build/test-results/jsBrowserTest
            solve-z3/build/reports/tests/jsBrowserTest
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: Browser Wasm / MiniZinc Chuffed and Z3
          status: ${{ job.status }}
