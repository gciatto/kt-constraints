name: Test Extensively
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM Kotest suites
        run: ./gradlew jvmTest --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: JVM tests / ${{ matrix.os }} / JDK ${{ matrix.jdk }}
          status: ${{ job.status }}

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin/JS Kotest suites
        run: ./gradlew jsTest --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: JavaScript tests / Node 22
          status: ${{ job.status }}

  test-native:
    # Native targets appear incrementally; this job only tests a target when registered.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
          - os: macos-latest
            target: macosArm64
          - os: windows-latest
            target: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test portable representation and solver contracts on native target
        run: >-
          ./gradlew :core:${{ matrix.target }}Test :model:${{ matrix.target }}Test :dsl:${{ matrix.target }}Test
          :solve:${{ matrix.target }}Test :solve-spi:${{ matrix.target }}Test
          :test-solve:${{ matrix.target }}Test :solve-minizinc:${{ matrix.target }}Test --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: Native tests / ${{ matrix.target }}
          status: ${{ job.status }}

  test-minizinc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install MiniZinc and Gecode
        run: sudo apt-get update && sudo apt-get install -y minizinc
      - name: Run actual Gecode conformance and differential tests
        env:
          MINIZINC_EXECUTABLE: minizinc
        run: ./gradlew :solve-minizinc:jvmTest --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: MiniZinc / Gecode conformance
          status: ${{ job.status }}
