name: Test Extensively
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM Kotest suites
        run: ./gradlew jvmTest --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: JVM tests / ${{ matrix.os }} / JDK ${{ matrix.jdk }}
          status: ${{ job.status }}

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin/JS Kotest suites
        run: ./gradlew jsTest --parallel --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: JavaScript tests / Node 22
          status: ${{ job.status }}

  test-native:
    # Native targets appear incrementally; this job only tests a target when registered.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
          - os: macos-latest
            target: macosArm64
          - os: windows-latest
            target: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision the pinned HiGHS C library
        if: matrix.target != 'mingwX64'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linuxX64)
              highs=x86_64-linux-gnu-cxx11; highs_sha=16a80d17da67c885718898d07b44157877aa738d10c09a59c89228c12fe65beb
              lbt=x86_64-linux-gnu; lbt_sha=57e60364c2314ad2d3676a49f1b6d16569964048d34d7f0288a5ffd54dfce22c
              library=libhighs.so.1.16.0 ;;
            macosArm64)
              highs=aarch64-apple-darwin; highs_sha=3ade8c40b789c43bcd514c57ca2dc4fed9226483048553f239452b715064b50f
              lbt=aarch64-apple-darwin; lbt_sha=f7e337908a2f054db2e2ec0478deefd096b44c3fad1601d78821bb68783fa001
              # Unlike Linux, macOS resolves libhighs' zlib through @rpath, so it must sit beside it as well.
              zlib=aarch64-apple-darwin; zlib_sha=c0c8d05315e8948e6fba4854d5e7e96e2da21db5e0cefcf8140abe03ade8db41
              library=libhighs.dylib ;;
          esac
          base=https://github.com/JuliaBinaryWrappers
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/highs.tgz" \
            "$base/HiGHS_jll.jl/releases/download/HiGHS-v1.16.0%2B0/HiGHS.v1.16.0.$highs.tar.gz"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/lbt.tgz" \
            "$base/libblastrampoline_jll.jl/releases/download/libblastrampoline-v5.16.0%2B0/libblastrampoline.v5.16.0.$lbt.tar.gz"
          echo "$highs_sha  $RUNNER_TEMP/highs.tgz" | shasum -a 256 --check
          echo "$lbt_sha  $RUNNER_TEMP/lbt.tgz" | shasum -a 256 --check
          # libhighs finds libblastrampoline beside it through its $ORIGIN / @loader_path search path.
          mkdir "$RUNNER_TEMP/highs"
          tar -xzf "$RUNNER_TEMP/highs.tgz" -C "$RUNNER_TEMP/highs"
          tar -xzf "$RUNNER_TEMP/lbt.tgz" -C "$RUNNER_TEMP/highs"
          if [ -n "${zlib:-}" ]; then
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/zlib.tgz" \
              "$base/Zlib_jll.jl/releases/download/Zlib-v1.3.1%2B2/Zlib.v1.3.1.$zlib.tar.gz"
            echo "$zlib_sha  $RUNNER_TEMP/zlib.tgz" | shasum -a 256 --check
            tar -xzf "$RUNNER_TEMP/zlib.tgz" -C "$RUNNER_TEMP/highs"
          fi
          echo "KT_CONSTRAINTS_HIGHS_LIBRARY=$RUNNER_TEMP/highs/lib/$library" >> "$GITHUB_ENV"
      - name: Test portable representation and solver contracts on native target
        run: >-
          ./gradlew :core:${{ matrix.target }}Test :model:${{ matrix.target }}Test :dsl:${{ matrix.target }}Test
          :solve:${{ matrix.target }}Test :solve-spi:${{ matrix.target }}Test
          :test-solve:${{ matrix.target }}Test :solve-kotlin:${{ matrix.target }}Test
          :solve-minizinc:${{ matrix.target }}Test :solve-z3:${{ matrix.target }}Test
          :solve-linear:${{ matrix.target }}Test :solve-highs:${{ matrix.target }}Test
          :solve-auto:${{ matrix.target }}Test
          --parallel --continue
      - name: Test the C shared library from C, against the pinned Z3
        if: matrix.target != 'mingwX64'
        run: ./gradlew :interop-c:nativeUsageTest
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: Native tests / ${{ matrix.target }}
          status: ${{ job.status }}

  test-minizinc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned MiniZinc multi-engine bundle
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/minizinc.tgz" \
            https://github.com/MiniZinc/MiniZincIDE/releases/download/2.10.1/MiniZincIDE-2.10.1-x86_64-linux-gnu.tgz
          echo "b63dd88491d47b05d0eb0ff4aa1112d1e6f77292c023800b20b98851458ce01c  $RUNNER_TEMP/minizinc.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/minizinc"
          tar -xzf "$RUNNER_TEMP/minizinc.tgz" -C "$RUNNER_TEMP/minizinc" --strip-components=1
          echo "$RUNNER_TEMP/minizinc/bin" >> "$GITHUB_PATH"
          # fzn-gecode finds bundled Qt/ICU via its RUNPATH but needs the system EGL library.
          # A global LD_LIBRARY_PATH would break host tools such as git (pcre2 symbol clash).
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1
      - name: Run five actual engine conformance and differential suites
        env:
          MINIZINC_EXECUTABLE: minizinc
          MINIZINC_ENGINES: gecode,chuffed,cp-sat,highs,cbc
        run: >-
          ./gradlew :solve-minizinc:jvmTest :solve-minizinc:jsNodeTest :solve-minizinc:linuxX64Test
          :interop-js:typescriptUsageTest --continue
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: MiniZinc / five-engine conformance
          status: ${{ job.status }}

  test-minizinc-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run actual Chuffed browser Wasm contracts
        env:
          MINIZINC_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :solve-minizinc:jsBrowserTest --continue
      - name: Run actual Z3 browser Wasm contracts (cross-origin isolated)
        env:
          Z3_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :solve-z3:jsBrowserTest --continue
      - name: Run the TypeScript facade checks in Chromium against the packaged library (Z3 and Chuffed Wasm)
        env:
          INTEROP_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :interop-js:typescriptBrowserUsageTest --continue
      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minizinc-browser-test-results
          path: |
            solve-minizinc/build/test-results/jsBrowserTest
            solve-minizinc/build/reports/tests/jsBrowserTest
            build/js/packages/kt-constraints-solve-minizinc-test/browser-console.log
            solve-z3/build/test-results/jsBrowserTest
            solve-z3/build/reports/tests/jsBrowserTest
      - name: Job summary
        if: always()
        uses: ./.github/actions/ci-summary
        with:
          title: Browser Wasm / MiniZinc Chuffed and Z3
          status: ${{ job.status }}
