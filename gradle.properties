# Synchronized with the Kotlin / kt-mpp baseline of gciatto/kt-math and tuProlog/2p-kt (2026-11).
versionsFromCatalog=libs
nodeVersion=
useKotlinBom=false
ktTargetJvmDisable=false
ktTargetJsDisable=false
allWarningsAsErrors=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
org.gradle.console=plain
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
ktCompilerArgs=-opt-in=kotlin.js.ExperimentalJsExport;-opt-in=kotlin.time.ExperimentalTime;-Xexpect-actual-classes
ktCompilerArgsJvm=-jvm-default=enable;-Xjdk-release=17
ktCompilerArgsJs=-Xes-long-as-bigint
jvmTestFramework=junit5
mochaTimeout=180s
docStyle=html
disableJavadocTask=true
kotlin.native.ignoreDisabledTargets=true
# solve-z3 nativeMain calls its cinterop shim from shared native code.
kotlin.mpp.enableCInteropCommonization=true

